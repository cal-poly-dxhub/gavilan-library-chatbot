# Gavilan Library Chatbot - declarative configuration.
#
# Single source of truth for changeable knobs. The CDK app in infra/ reads this file
# (resolved at the repo root, one level up from infra/) and wires the values into the
# stack. 

knowledge_base:
  name: gavilan-library-kb
  # Titan Text Embeddings v2 -> 1024-dimension vectors.
  embedding_model_id: amazon.titan-embed-text-v2:0
  vector_dimension: 1024

vector_store:
  # Amazon S3 Vectors store (replaces OpenSearch Serverless). Semantic-search-only (no hybrid):
  # the cheap/light tradeoff the sponsor chose. Keyword coverage is handled later by agentifying
  # the bot with a structured lookup tool (out of scope here).
  #
  # Vector-bucket names follow S3-style rules (3-63 chars, lowercase letters/numbers/hyphens).
  vector_bucket_name: gavilan-library-vectors
  # Index name: 3-63 chars, lowercase letters/numbers/hyphens/dots.
  index_name: bedrock-knowledge-base-default-index
  # float32 is the only supported vector data type.
  data_type: float32
  # cosine: Titan Embed Text v2 embeddings are normalized, so cosine ranks equivalently to the
  # old OpenSearch l2. (Index dimension is knowledge_base.vector_dimension = 1024, the single
  # source of truth; it MUST equal the embedding model's output or ingestion fails.)
  distance_metric: cosine
  # Bedrock-internal metadata keys marked NON-filterable AT CREATION (IMMUTABLE afterward). Left
  # filterable, they blow S3 Vectors' ~1 KB / 35-key filterable-metadata limit and every ingestion
  # fails with ValidationException. AMAZON_BEDROCK_TEXT (chunk text) + AMAZON_BEDROCK_METADATA are
  # the documented culprits; the x-amz-bedrock-kb-* keys are added defensively (max is 10 keys, we
  # use 5). Retrieval never filters on any of these, so non-filterable costs nothing.
  non_filterable_metadata_keys:
    - AMAZON_BEDROCK_TEXT
    - AMAZON_BEDROCK_METADATA
    - x-amz-bedrock-kb-source-uri
    - x-amz-bedrock-kb-chunk-id
    - x-amz-bedrock-kb-data-source-id

data_source:
  web_crawler:
    # Seed URLs. Placeholder for now; the real sponsor list drops in here later.
    seed_urls:
      - https://www.gavilan.edu/library/
    # Blacklist regex patterns (exclusion filters). Empty for now.
    exclude_patterns: []
    # Allowlist regex patterns (inclusion filters). Empty for now.
    include_patterns: []
    # Crawl scope. One of: DEFAULT, HOST_ONLY, SUBDOMAINS.
    # HOST_ONLY keeps the crawl on www.gavilan.edu and does not wander to subdomains.
    scope: HOST_ONLY
    # Rate limits.
    max_pages: 1000
    rate_limit: 300   # max crawl requests per minute

# --- Custom scraper (standalone local tool; NOT part of the CDK/Lambda yet) ---
#
# Replaces the removed managed Web Crawler. For now it runs locally (scraper/scraper.py) and
# writes clean markdown + a metadata JSON sidecar per page to output_dir for manual inspection;
# a Lambda wrapper that uploads to the KB S3 source bucket comes next. seed_urls is an EXPLICIT
# curated list - NO recursive crawling (the managed crawler over-crawled the /library/ tree and
# hit ingestion limits; an explicit list is also how the sponsor's URL list will arrive).
scraper:
  seed_urls:
    - https://www.gavilan.edu/library/howdoi.php
    - https://www.gavilan.edu/library/libraryservices.php
    - https://www.gavilan.edu/library/about-the-library.php
    - https://www.gavilan.edu/library/contactus.php
    - https://www.gavilan.edu/library/ill.php
    - https://www.gavilan.edu/library/researchassistance.php
    - https://www.gavilan.edu/library/findresources.php
    - https://www.gavilan.edu/library/librarycard.php
    - https://www.gavilan.edu/library/libcardexamples.php
    - https://www.gavilan.edu/library/citingsources.php
    - https://www.gavilan.edu/library/librarycourses.php
    - https://www.gavilan.edu/library/facultyservices.php
    - https://www.gavilan.edu/library/otherlibraries.php
    - https://www.gavilan.edu/library/orientationrequest.php
    - https://www.gavilan.edu/library/databases.php
    - https://www.gavilan.edu/library/sites.php
  output_dir: ./scraper_output
  timeout_seconds: 20
  user_agent: "GavilanLibraryScraper/1.0 (+https://www.gavilan.edu/library/)"
  # EventBridge schedule for the automated re-scrape Lambda (maintenance window). Standard
  # EventBridge cron, UTC. Default: weekly, Sunday 10:00 UTC (~2-3am Pacific), a low-traffic
  # window. Change cadence here. (output_dir is local-run only; the Lambda uploads to S3.)
  schedule_cron: "cron(0 10 ? * SUN *)"

chunking:
  # v1 uses managed FIXED_SIZE chunking (architecture.md Phase 1). Phase 2 moves to
  # HIERARCHICAL. One of: FIXED_SIZE, HIERARCHICAL, SEMANTIC, NONE.
  strategy: FIXED_SIZE
  max_tokens: 300
  overlap_percentage: 20

# --- Query path (Lambda + HTTP API) ---

http_api:
  # Stage-level request throttling, applied to EVERY route (/query and /warm). This is the
  # load-bearing cost-abuse control for the public, unauthenticated endpoint that fans out to
  # paid Bedrock calls - it is the stated reason WAF was excluded. Sized for a single library
  # widget: a handful of requests/sec with a small burst. Clients get HTTP 429 over the limit.
  throttling_rate_limit: 10     # steady-state requests per second across the stage
  throttling_burst_limit: 20    # maximum burst (bucket capacity)

request:
  # Max characters accepted for a user query. Over this, the handler returns HTTP 400 BEFORE
  # any retrieval or guardrail call. This is the real server-side size control
  # (the widget maxlength is advisory UX only); the platform limits (API GW 10MB / Lambda 6MB)
  # are far too high to guard against cost-amplifying huge pastes. A library FAQ question is
  # short, so 2000 chars is already generous.
  max_query_chars: 2000

retrieval:
  # Number of KB chunks to retrieve per query and feed to generation.
  number_of_results: 5

generation:
  # Bedrock-hosted Claude model for answer generation, invoked via a CROSS-REGION INFERENCE
  # PROFILE.
  model_id: us.anthropic.claude-sonnet-4-6
  # Converse inference knobs. A factual FAQ bot wants short, direct, low-variance answers: cap
  # the output length and keep temperature low. Sensible ranges: max_tokens ~500-700,
  # temperature 0-0.3.
  max_tokens: 600
  temperature: 0.2

# --- Database catalog (Phase 2b: self-updating) ---
#
# The database_catalog tool's HELD list is regenerated from databases.php on every scrape: the
# scraper parses the A-Z table (deterministic names/descriptions/URLs) then a model enriches each
# database with subjects + aliases, and writes the result to S3. The agent reads that fresh copy.
# The hand-authored NOT-HELD list stays in the bundled app/data/database_catalog.json (absence
# can't be scraped) and is merged in at read time.
catalog:
  # S3 object key for the regenerated held catalog (in the dedicated catalog bucket the stack
  # creates). The bucket name is wired to both Lambdas as an env var by the stack.
  s3_key: database_catalog.json
  # Model that assigns subjects + aliases to each parsed database. Runs once per weekly scrape on
  # ~one page, and only for newly-added databases, so cost is negligible. A live dry-run showed
  # Sonnet 4.6 produces high-quality subjects AND aliases (e.g. "EBSCO", "OVIC", "PBSC"), matching
  # the hand-built catalog; cheaper models gave good subjects but almost no aliases, which would
  # break name-matching like "do you have EBSCO?". So use Sonnet.
  enrichment_model_id: us.anthropic.claude-sonnet-4-6
  # Robustness guard: the smallest plausible number of databases a good extraction yields. If a
  # scrape parses fewer (page broken/restructured), the scraper KEEPS the last-good catalog instead
  # of overwriting it. The real page currently lists ~46; 30 leaves headroom without accepting junk.
  min_databases: 30
  # Per-container cache TTL (seconds) for the agent's S3 read of the catalog. Weekly-changing data,
  # so 15 min stale is fine and avoids an S3 GET per query.
  cache_ttl_seconds: 900

# --- Bedrock Guardrails ---
#
# TWO guardrails are built from this config:
#
#   INPUT screen  - run via the standalone ApplyGuardrail API (source=INPUT) on the BARE
#                   user query, BEFORE retrieval. Content filters + PROMPT_ATTACK BLOCK the
#                   request; PII is ANONYMIZE (mask) so the query is masked-and-proceeds
#                   silently rather than blocked. Blocked queries never reach retrieval or
#                   generation (no Bedrock spend on abuse).
#   OUTPUT backstop - attached to the Converse call. Screens the generated ANSWER only:
#                   content filters on the output side (input strengths forced to NONE so
#                   the retrieved <context> is never screened), and NO PII policy at all
#                   (retrieved library info is public; masking the answer would re-break
#                   contact/hours/location answers).

guardrail:
  # Two distinct guardrail resources are created with these names.
  input_name: gavilan-library-input-guardrail
  output_name: gavilan-library-output-guardrail
  # Converse guardrail trace behavior for the OUTPUT backstop: enabled | disabled | enabled_full.
  trace: enabled
  # Content filters. strength: NONE | LOW | MEDIUM | HIGH.
  #   - INPUT guardrail uses these strengths as written (only its input side is exercised).
  #   - OUTPUT guardrail uses output_strength with input forced to NONE, and drops
  #     PROMPT_ATTACK (which is input-only; AWS requires its output strength to be NONE).
  content_filters:
    - type: HATE
      input_strength: HIGH
      output_strength: HIGH
    - type: SEXUAL
      input_strength: HIGH
      output_strength: HIGH
    - type: INSULTS
      input_strength: MEDIUM
      output_strength: MEDIUM
    - type: VIOLENCE
      input_strength: MEDIUM
      output_strength: MEDIUM
    - type: MISCONDUCT
      input_strength: MEDIUM
      output_strength: MEDIUM
    - type: PROMPT_ATTACK
      input_strength: HIGH
      output_strength: NONE   # INPUT only
  # Sensitive information (PII) for the INPUT screen. ALL entities ANONYMIZE (mask/redact,
  # e.g. an email becomes {EMAIL}); none BLOCK, so a masked query always proceeds. The
  # OUTPUT guardrail carries no PII policy.
  pii_anonymize_entities:
    - EMAIL
    - PHONE
    - NAME
    - ADDRESS
    - USERNAME
    - AGE
    - PASSWORD
    - US_SOCIAL_SECURITY_NUMBER
    - CREDIT_DEBIT_CARD_NUMBER
    - CREDIT_DEBIT_CARD_CVV
    - PIN
    - INTERNATIONAL_BANK_ACCOUNT_NUMBER
    - SWIFT_CODE
    - DRIVER_ID
  # Friendly, student-facing blocked messages (match the bot's tone). The INPUT screen
  # returns blocked_input_messaging; the Converse OUTPUT backstop returns blocked_outputs_messaging.
  blocked_input_messaging: "I can't help with that request. I'm here for questions about the Gavilan College Library, like hours, checkouts, and finding materials."
  blocked_outputs_messaging: "I'm not able to provide a response to that. Try asking about library hours, services, or materials, or reach out to a librarian for more help."
