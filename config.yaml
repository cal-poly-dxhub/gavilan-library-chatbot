# Gavilan Library Chatbot - declarative configuration.
#
# Single source of truth for changeable knobs. The CDK app in infra/ reads this file
# (resolved at the repo root, one level up from infra/) and wires the values into the
# stack. 

knowledge_base:
  name: gavilan-library-kb
  # Titan Text Embeddings v2 -> 1024-dimension vectors.
  embedding_model_id: amazon.titan-embed-text-v2:0
  vector_dimension: 1024

vector_store:
  # Amazon S3 Vectors store. Semantic-search-only (no hybrid): a deliberate cost/simplicity
  # tradeoff. Keyword coverage is handled by agentifying the bot with a structured lookup tool.
  #
  # Vector-bucket names follow S3-style rules (3-63 chars, lowercase letters/numbers/hyphens).
  vector_bucket_name: gavilan-library-vectors
  # Index name: 3-63 chars, lowercase letters/numbers/hyphens/dots.
  index_name: bedrock-knowledge-base-default-index
  # float32 is the only supported vector data type.
  data_type: float32
  # cosine: Titan Embed Text v2 embeddings are normalized, so cosine ranks equivalently to the
  # old OpenSearch l2. (Index dimension is knowledge_base.vector_dimension = 1024, the single
  # source of truth; it MUST equal the embedding model's output or ingestion fails.)
  distance_metric: cosine
  # Bedrock-internal metadata keys marked NON-filterable AT CREATION (IMMUTABLE afterward). Left
  # filterable, they blow S3 Vectors' ~1 KB / 35-key filterable-metadata limit and every ingestion
  # fails with ValidationException. AMAZON_BEDROCK_TEXT (chunk text) + AMAZON_BEDROCK_METADATA are
  # the documented culprits; the x-amz-bedrock-kb-* keys are added defensively (max is 10 keys, we
  # use 5). Retrieval never filters on any of these, so non-filterable costs nothing.
  non_filterable_metadata_keys:
    - AMAZON_BEDROCK_TEXT
    - AMAZON_BEDROCK_METADATA
    - x-amz-bedrock-kb-source-uri
    - x-amz-bedrock-kb-chunk-id
    - x-amz-bedrock-kb-data-source-id

data_source:
  web_crawler:
    # Seed URLs to crawl. Replace with the library pages you want ingested.
    seed_urls:
      - https://www.gavilan.edu/library/
    # Blacklist regex patterns (exclusion filters). Empty for now.
    exclude_patterns: []
    # Allowlist regex patterns (inclusion filters). Empty for now.
    include_patterns: []
    # Crawl scope. One of: DEFAULT, HOST_ONLY, SUBDOMAINS.
    # HOST_ONLY keeps the crawl on www.gavilan.edu and does not wander to subdomains.
    scope: HOST_ONLY
    # Rate limits.
    max_pages: 1000
    rate_limit: 300   # max crawl requests per minute

# --- Custom scraper (standalone local tool; NOT part of the CDK/Lambda yet) ---
#
# Replaces the removed managed Web Crawler. For now it runs locally (scraper/scraper.py) and
# writes clean markdown + a metadata JSON sidecar per page to output_dir for manual inspection;
# a Lambda wrapper uploads to the KB S3 source bucket. seed_urls is an EXPLICIT curated list -
# NO recursive crawling (the managed crawler over-crawled the /library/ tree and hit ingestion
# limits, so pages are listed explicitly instead).
scraper:
  seed_urls:
    - https://www.gavilan.edu/library/howdoi.php
    - https://www.gavilan.edu/library/libraryservices.php
    - https://www.gavilan.edu/library/about-the-library.php
    - https://www.gavilan.edu/library/contactus.php
    - https://www.gavilan.edu/library/ill.php
    - https://www.gavilan.edu/library/researchassistance.php
    - https://www.gavilan.edu/library/findresources.php
    - https://www.gavilan.edu/library/librarycard.php
    - https://www.gavilan.edu/library/libcardexamples.php
    - https://www.gavilan.edu/library/citingsources.php
    - https://www.gavilan.edu/library/librarycourses.php
    - https://www.gavilan.edu/library/facultyservices.php
    - https://www.gavilan.edu/library/otherlibraries.php
    - https://www.gavilan.edu/library/orientationrequest.php
    # Stays in the SEED list but is excluded from the KB below: the scraper parses this page's
    # HTML to regenerate the held database_catalog (lambda_function.regenerate_catalog looks for
    # "databases.php" in the scrape results), so dropping it here would silently freeze the
    # catalog at its last-good copy.
    - https://www.gavilan.edu/library/databases.php
    # REMOVED: sites.php ("Selected Websites by Subject"). 13,209 chars - the single largest noise
    # source in the corpus. It is 133 alphabetical entries of EXTERNAL website names, and the
    # extractor strips their URLs, so the bot could name a site but never link to it while
    # <citations> forbids writing the URL from memory. In a live 11-question round it surfaced in
    # 8 answers and contributed to none: subject words match nearly every query. Nothing is lost -
    # researchassistance.php still describes the service, and the questions it would serve are
    # research questions, which are out of scope by design.
    # Laptop and equipment support. The ONLY source for the program lending list (EOPS,
    # Non-Credit, CTE, El Centro, AEC), the semester renewal-by-emailed-form flow, and the
    # "laptop tech support goes to circulation, not IT" routing. Note it contradicts
    # howdoi.php ("Reserves and semester laptops cannot be renewed") - staff are resolving.
    - https://www.gavilan.edu/library/laptopsupport.php
    # --- College pages, not library pages ---
    # Every seed above is under /library/. These three answer questions the bot is actually
    # asked but the library site cannot cover: where a campus office is, and which books a
    # course requires. They widen scope past library operations, which is deliberate.
    #   main_map      - Office Guide (Financial Aid Office -> SC) + Building Guide legend
    #   finaid        - Financial Aid office hours
    #   bookstore     - the bookstore as the per-course materials source, plus its hours
    - https://www.gavilan.edu/about/maps/main_map.php
    - https://www.gavilan.edu/finaid/index.php
    - https://www.gavilan.edu/student/bookstore/index.php
  # Scraped for their side effects, never indexed. The scraper fetches these normally but does not
  # upload them to the KB source bucket, and the prune step keeps them out of it.
  #   databases.php - regenerate_catalog needs its HTML, but the CONTENT is redundant: the whole
  #   page is names + descriptions by subject, which is exactly what the authoritative
  #   database_catalog tool serves, and its one unique line (off-campus access needs your library
  #   card or GavID) is already duplicated in researchassistance.php. At 15,221 chars it would
  #   otherwise be a third of the entire corpus and it surfaced as retrieval noise 5 times in one
  #   live round without ever contributing to an answer.
  kb_exclude_urls:
    - https://www.gavilan.edu/library/databases.php
  output_dir: ./scraper_output
  timeout_seconds: 20
  user_agent: "GavilanLibraryScraper/1.0 (+https://www.gavilan.edu/library/)"
  # EventBridge schedule for the automated re-scrape Lambda (maintenance window). Standard
  # EventBridge cron, UTC. Default: weekly, Sunday 10:00 UTC (~2-3am Pacific), a low-traffic
  # window. Change cadence here. (output_dir is local-run only; the Lambda uploads to S3.)
  schedule_cron: "cron(0 10 ? * SUN *)"

chunking:
  # v1 uses managed FIXED_SIZE chunking (architecture.md Phase 1). Phase 2 moves to
  # HIERARCHICAL. One of: FIXED_SIZE, HIERARCHICAL, SEMANTIC, NONE.
  strategy: FIXED_SIZE
  # 600, not 300. The offline chunking eval (eval/run_chunking_eval.py) measured 300-token
  # boundaries cutting 26% of golden answers in half - the library's hours table and staff
  # directory live on one page and a 300-token window splits them, which is why several answers
  # cited the right page but gave contact details with no hours. At 600 evidence integrity is
  # 100%. CAVEAT: that eval measures BOUNDARIES only, never ranking - a bigger chunk averages its
  # embedding over more text and can retrieve less precisely. Re-run eval/retrieval_probe.py
  # after any change here and compare against the 300-token baseline (recall@1 71%, @3 88%,
  # @5 94%, @8 100%). CHANGING THIS IS DESTRUCTIVE: Bedrock chunking is immutable, so CDK
  # replaces the data source and the whole corpus re-indexes.
  max_tokens: 600
  overlap_percentage: 20

# --- Query path (Lambda + HTTP API) ---

http_api:
  # Stage-level request throttling, applied to EVERY route (/query and /warm). This is the
  # load-bearing cost-abuse control for the public, unauthenticated endpoint that fans out to
  # paid Bedrock calls - it is the stated reason WAF was excluded. Sized for a single library
  # widget: a handful of requests/sec with a small burst. Clients get HTTP 429 over the limit.
  throttling_rate_limit: 10     # steady-state requests per second across the stage
  throttling_burst_limit: 20    # maximum burst (bucket capacity)

# --- CORS (browser preflight allowlist for the HTTP API) ---
#
# Which page origins a BROWSER will let call /query and /warm. The widget is embedded on
# https://www.gavilan.edu/library/, but the browser sends a host-only Origin header
# (https://www.gavilan.edu) - the path is irrelevant to CORS, so do not add one here.
#
# This is NOT a security boundary: CORS is browser-enforced only, so curl/scripts bypass it
# entirely. API Gateway stage throttling above stays the real cost cap. What this DOES buy is
# stopping a random third-party site from silently driving our billable /query endpoint
# (Bedrock + Primo spend) from its visitors' browsers.
#
# Never set this to "*" - the stack rejects a wildcard at synth. We send no cookies or auth
# headers, so AllowCredentials stays off and the wildcard-with-credentials rules do not apply.
# Entries are matched as EXACT, FULL origin strings by API Gateway, so each one is scheme +
# host (+ port), with no trailing slash and no path. A stray slash does not "mostly work" - it
# never matches, and the browser blocks every call from that origin.
cors:
  allow_origins:
    - https://www.gavilan.edu       # production: the library site hosting the widget
    - http://localhost:8000         # DEV ONLY (frontend/demo.html) - safe to delete for final launch
    # The demo site's custom hostname. The stack already appends the demo distribution's own
    # *.cloudfront.net origin at deploy time, but that is a DIFFERENT origin string: a browser
    # on the friendly hostname sends this one, matches nothing, and the chat dies while the
    # page itself loads fine. Listed here rather than derived because the hostname is a DNS +
    # certificate decision made outside this stack (the distribution carries no alternate
    # domain name), so nothing in the template knows it exists.
    - https://gavbot-demo.calpoly.io

# --- Shareable demo site ---
#
# A public page (its own S3 bucket + CloudFront distribution) that embeds the production widget
# in a Gavilan-Library-looking sample site, so one `cdk deploy` hands back a link the client can
# open with no setup. The page is frontend/demo-site.html; the stack stamps the deployed API URL
# and widget CDN URL into it at deploy time, so nothing about it is account- or region-specific.
#
# Two things follow from enabling it, both handled by the stack:
#   - its CloudFront origin is appended to the CORS allowlist above (the demo runs the REAL
#     cross-origin embed, so the browser needs the origin listed - it is resolved from the
#     distribution at deploy, never hardcoded)
#   - the page is served with a noindex meta tag AND an X-Robots-Tag response header
#
# Set to false for a launched install that no longer needs a showcase; the next deploy removes
# the bucket, the distribution, and the extra CORS origin. Removing the widget/production path
# is NOT affected either way - the demo has its own bucket and CDN.
demo_site:
  enabled: true

# --- Cost model (the demo page's session meter + monthly estimator) ---------------------
#
# Feeds frontend/demo-site.html, which the stack stamps at deploy time exactly like the API
# and widget URLs. Nothing here reaches a Lambda, and nothing here reads a bill: it is
# published list rates multiplied by MEASURED usage. No Cost Explorer call, no account
# spend, no billing API - the page says "estimate" everywhere for that reason.
#
# TWO HALVES, deliberately kept apart:
#   rates     - published AWS list prices. Change when AWS changes them, and move `as_of`.
#   measured  - what one real question actually consumed, from eval/measure_usage.py against
#               the deployed endpoint. Re-run that script and paste its output after any
#               change that moves token usage (retrieval.number_of_results, chunking,
#               the system prompt, the link table, generation.max_tokens).
#
# WHY MEASURED AND NOT DERIVED. Three things make the obvious estimate wrong, and all three
# are invisible from the outside:
#   - one question is not one model call (agentic loop, and each call resends everything);
#   - the retrieved passages ride in the input tokens and dominate them;
#   - the guardrails bill per text unit on every turn, not once per question.
cost_model:
  # Shown on the page. Rates move; a figure with no date is not checkable.
  as_of: "2026-07-29"
  region: us-west-2
  currency: USD

  # Published AWS list prices for us-west-2, verified 2026-07-29.
  # Sources: Claude Sonnet 4.6 on Bedrock ($3/$15 per million tokens, aws.amazon.com/bedrock/pricing);
  # everything else from the AWS Price List API for us-west-2 (Titan Embed V2, the guardrail
  # policy unit rates) and the S3 / Lambda / API Gateway / CloudFront pricing pages.
  # NOTE: the Price List API does not publish the newer Bedrock Anthropic models, so the
  # generation rates come from the pricing page rather than the API. Recheck both on update.
  rates:
    generation_input_per_1m: 3.00        # Claude Sonnet 4.6 input
    generation_output_per_1m: 15.00      # Claude Sonnet 4.6 output
    embedding_per_1m: 0.02               # Titan Text Embeddings V2
    guardrail_content_per_1k_units: 0.15 # content filters, per 1,000 text units
    guardrail_pii_per_1k_units: 0.10     # sensitive-information filters, per 1,000 text units
    vector_query_per_1m: 2.50            # S3 Vectors queries
    vector_storage_per_gb_month: 0.06    # S3 Vectors storage
    vector_put_per_gb: 0.20              # S3 Vectors writes (128 KB minimum per PUT)
    s3_storage_per_gb_month: 0.0265      # S3 Standard, first 50 TB
    lambda_per_1m_requests: 0.20
    lambda_per_gb_second: 0.0000166667
    api_requests_per_1m: 1.00            # HTTP API (API Gateway v2), first 300M
    cloudfront_per_1m_requests: 1.00     # HTTPS requests, North America
    logs_ingest_per_gb: 0.50

  # What ONE question actually consumed, measured live. See eval/measure_usage.py.
  measured:
    at: "2026-07-29"
    # 20 single-turn questions spanning all four tools, plus 5 conversations run 8 turns deep.
    sample_questions: 60
    # Converse invocations per question. Above 1 because the loop re-calls the model after a
    # tool result; first questions need a second call far more often than follow-ups do.
    model_calls_avg: 1.23
    # Input tokens for ONE model call: system prompt + link table + history + the retrieved
    # passages. Measured PER CALL rather than per question so the loop-length effect and the
    # history-depth effect stay separable - the estimator multiplies them back together.
    context_tokens_per_call_base: 10666
    # The depth effect, isolated. Small on purpose: _seed_messages rebuilds history from TEXT
    # turns only, so a prior turn adds a question and an answer, NOT the passages behind them.
    # It also stops growing once MAX_HISTORY_MESSAGES trims, around the fifth exchange.
    context_tokens_per_call_per_prior_turn: 54
    output_tokens_avg: 230
    retrievals_avg: 1.08
    # Content-filter text units per question (input screen + output backstop on each turn).
    # A unit covers 1,000 characters, so a long answer spends an extra one; hence a measured
    # average rather than the tidy "1 + model_calls".
    guardrail_content_units_avg: 2.22
    # Zero in practice: the PII policy is on the INPUT screen only, and student questions
    # contain no PII. Kept as a field so a deployment that does see PII can price it.
    guardrail_pii_units_avg: 0.0
    # Query Lambda compute per question: measured mean billed duration 6.58s at 256 MB.
    # Small (well under a tenth of a cent) but it is the one per-question cost that is not
    # Bedrock, so leaving it out would make the model look tidier than it is.
    query_lambda_gb_seconds: 1.64
    # Tokens embedded per retrieval (the priming query is capped at 400 characters).
    retrieval_query_tokens: 100

  # What exists when nobody is asking anything. Inputs, not answers: the page multiplies
  # these by the rates above and shows the itemization, so the floor can be checked rather
  # than trusted. All measured against the deployed stack on 2026-07-29.
  baseline:
    # S3 Standard across all four buckets (KB source, catalog, widget, demo page).
    s3_stored_bytes: 135177
    # S3 Vectors: 24 vectors in the live index; 1024 float32 dims plus the chunk text and
    # Bedrock's metadata keys.
    vector_count: 24
    vector_bytes_each: 7000
    # Tokens embedded by ONE full re-ingestion: the 18 indexed documents (~7,500 tokens)
    # plus the 20% chunk overlap.
    ingest_embedded_tokens: 9000
    # Scraper Lambda: 512 MB, measured billed durations of 25s and 67s.
    scraper_seconds_per_run: 46
    scraper_memory_gb: 0.5
    # Weekly EventBridge schedule.
    scrapes_per_month: 4.33
    # Every `cdk deploy` re-runs the scraper and re-ingests the corpus, so deploy frequency
    # is a real (if small) driver of the floor. Assumption, not a measurement - it is the one
    # number here nobody can measure for you. Shown as a line item on the page.
    deploys_per_month: 4
    # CloudWatch Logs across the stack's log groups, at rest.
    log_gb_per_month: 0.02

request:
  # Max characters accepted for a user query. Over this, the handler returns HTTP 400 BEFORE
  # any retrieval or guardrail call. This is the real server-side size control
  # (the widget maxlength is advisory UX only); the platform limits (API GW 10MB / Lambda 6MB)
  # are far too high to guard against cost-amplifying huge pastes. A library FAQ question is
  # short, so 2000 chars is already generous.
  max_query_chars: 2000

retrieval:
  # Number of KB chunks to retrieve per query and feed to generation.
  #
  # Raised 5 -> 8 after a live round where the answer to "how do I get help with research?" was
  # missing the reference desk's phone/email/chat entirely: that block exists in libraryservices.php
  # and simply lost a slot race, while two of the five slots went to near-miss noise (an A-Z link
  # fragment from sites.php and a faculty-facing page). The block was retrievable, just ranked out.
  # Cheapest lever available - config only, no re-ingest, and it costs a few hundred tokens a turn.
  number_of_results: 8

generation:
  # Bedrock-hosted Claude model for answer generation, invoked via a CROSS-REGION INFERENCE
  # PROFILE.
  model_id: us.anthropic.claude-sonnet-4-6
  # Converse inference knobs. A factual FAQ bot wants short, direct, low-variance answers: cap
  # the output length and keep temperature low. Sensible ranges: max_tokens ~500-700,
  # temperature 0-0.3.
  max_tokens: 600
  temperature: 0.2

# --- Database catalog (Phase 2b: self-updating) ---
#
# The database_catalog tool's HELD list is regenerated from databases.php on every scrape: the
# scraper parses the A-Z table (deterministic names/descriptions/URLs) then a model enriches each
# database with subjects + aliases, and writes the result to S3. The agent reads that fresh copy.
# The hand-authored NOT-HELD list stays in the bundled app/data/database_catalog.json (absence
# can't be scraped) and is merged in at read time.
catalog:
  # S3 object key for the regenerated held catalog (in the dedicated catalog bucket the stack
  # creates). The bucket name is wired to both Lambdas as an env var by the stack.
  s3_key: database_catalog.json
  # Model that assigns subjects + aliases to each parsed database. Runs once per weekly scrape on
  # ~one page, and only for newly-added databases, so cost is negligible. A live dry-run showed
  # Sonnet 4.6 produces high-quality subjects AND aliases (e.g. "EBSCO", "OVIC", "PBSC"), matching
  # the hand-built catalog; cheaper models gave good subjects but almost no aliases, which would
  # break name-matching like "do you have EBSCO?". So use Sonnet.
  enrichment_model_id: us.anthropic.claude-sonnet-4-6
  # Robustness guard: the smallest plausible number of databases a good extraction yields. If a
  # scrape parses fewer (page broken/restructured), the scraper KEEPS the last-good catalog instead
  # of overwriting it. The real page currently lists ~46; 30 leaves headroom without accepting junk.
  min_databases: 30
  # Per-container cache TTL (seconds) for the agent's S3 read of the catalog. Weekly-changing data,
  # so 15 min stale is fine and avoids an S3 GET per query.
  cache_ttl_seconds: 900

# --- Curated library links tool (library_links) ---
#
# A FIFTH agent tool: a small hand-authored table of the library's and college's canonical URLs
# (library home page, campus map, bookstore, research guides, ILL, laptop record, ...). It exists
# because no other path can produce these links - the KB only knows the scraped seed pages above,
# database_catalog cites the A-Z page, and the Primo tools cite per-query search URLs - so without
# it the model could only surface such a link by writing a URL from memory.
#
# Unlike the database catalog this is STATIC: it is bundled with the query Lambda, so there is no
# S3 object, no scraper step, and no cache TTL to tune. Edit app/data/<data_file> and redeploy.
# The single knob is the bundled filename, and the stack uses it for BOTH the Lambda asset include
# and the LIBRARY_LINKS_FILE env var so the two can never drift.
library_links:
  data_file: library_links.json

# --- Primo book/media catalog tool (search_book_catalog) ---
#
# A THIRD agent tool: a LIVE search of Gavilan's Primo discovery catalog (an undocumented public
# JSON endpoint the library sanctioned) for books/media. It returns candidate records + real-time
# availability; the MODEL judges whether any is a real match (Primo is NOT authoritative about
# absence - only total == 0 is a clean not-held signal). The endpoint identity (host, inst, vid,
# scope) is tied to the institution and lives in code (app/handler.py), not here; only the
# behavioral knobs below are tunable. It is a live third-party call inside the agent loop, so it
# is timed out and soft-fails (a dead Primo never kills a query).
primo:
  # Per-HTTP-call socket timeout (seconds) for each Primo call (the search + each availability
  # lookup). Bounds how long a slow Primo can hold the Converse loop / Lambda budget.
  timeout_seconds: 5
  # Number of candidate records returned to the model to judge. Each also costs one availability
  # (delivery) call, so keep this small - a few good candidates is enough for the model to match.
  number_of_results: 4
  # Total wall-clock cap (seconds) across ALL per-result availability lookups in one search. Past
  # it, remaining results report availability "unknown" instead of pushing toward the Lambda
  # timeout. Sized so search + availability stay well under the Lambda 30s with room for Converse.
  availability_budget_seconds: 8

# --- Bedrock Guardrails ---
#
# TWO guardrails are built from this config:
#
#   INPUT screen  - run via the standalone ApplyGuardrail API (source=INPUT) on the BARE
#                   user query, BEFORE retrieval. Content filters + PROMPT_ATTACK BLOCK the
#                   request; PII is ANONYMIZE (mask) so the query is masked-and-proceeds
#                   silently rather than blocked. Blocked queries never reach retrieval or
#                   generation (no Bedrock spend on abuse).
#   OUTPUT backstop - attached to the Converse call. Screens the generated ANSWER only:
#                   content filters on the output side (input strengths forced to NONE so
#                   the retrieved <context> is never screened), and NO PII policy at all
#                   (retrieved library info is public; masking the answer would re-break
#                   contact/hours/location answers).

guardrail:
  # Two distinct guardrail resources are created with these names.
  input_name: gavilan-library-input-guardrail
  output_name: gavilan-library-output-guardrail
  # Converse guardrail trace behavior for the OUTPUT backstop: enabled | disabled | enabled_full.
  trace: enabled
  # Content filters. strength: NONE | LOW | MEDIUM | HIGH.
  #   - INPUT guardrail uses these strengths as written (only its input side is exercised).
  #   - OUTPUT guardrail uses output_strength with input forced to NONE, and drops
  #     PROMPT_ATTACK (which is input-only; AWS requires its output strength to be NONE).
  content_filters:
    - type: HATE
      input_strength: HIGH
      output_strength: HIGH
    - type: SEXUAL
      input_strength: HIGH
      output_strength: HIGH
    - type: INSULTS
      input_strength: MEDIUM
      output_strength: MEDIUM
    - type: VIOLENCE
      input_strength: MEDIUM
      output_strength: MEDIUM
    - type: MISCONDUCT
      input_strength: MEDIUM
      output_strength: MEDIUM
    - type: PROMPT_ATTACK
      input_strength: HIGH
      output_strength: NONE   # INPUT only
  # Sensitive information (PII) for the INPUT screen. ALL entities ANONYMIZE (mask/redact,
  # e.g. an email becomes {EMAIL}); none BLOCK, so a masked query always proceeds. The
  # OUTPUT guardrail carries no PII policy.
  pii_anonymize_entities:
    - EMAIL
    - PHONE
    - NAME
    - ADDRESS
    - USERNAME
    - AGE
    - PASSWORD
    - US_SOCIAL_SECURITY_NUMBER
    - CREDIT_DEBIT_CARD_NUMBER
    - CREDIT_DEBIT_CARD_CVV
    - PIN
    - INTERNATIONAL_BANK_ACCOUNT_NUMBER
    - SWIFT_CODE
    - DRIVER_ID
  # Friendly, student-facing blocked messages (match the bot's tone). The INPUT screen
  # returns blocked_input_messaging; the Converse OUTPUT backstop returns blocked_outputs_messaging.
  #
  # BILINGUAL (English then Spanish, one blank line between them, rendered as two paragraphs
  # by the widget). These are STATIC guardrail configuration, returned by Bedrock instead of a
  # model reply: nothing translates them at runtime, and the widget's language control cannot
  # reach them either, so a Spanish-speaking student who trips a guardrail would otherwise hit
  # an English wall. Carrying both languages in the one string is the only way to serve both.
  # Bedrock caps each of these at 500 characters - keep the pair under it.
  # NOTE: guardrail policy text is baked into a published guardrail VERSION, so editing these
  # only takes effect on the next `cdk deploy` (which publishes a new version and repins the
