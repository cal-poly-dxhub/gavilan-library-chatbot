# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Answer-quality loop for the Gavilan Library chatbot.
#
# WHAT THIS IS: an on-demand tuning tool. It fires each golden question at the DEPLOYED
# /query endpoint and grades the returned answer on two axes - BEHAVIOR (did it do the right
# thing?) and GROUNDEDNESS (is the answer supported, or invented?). Change the system prompt /
# retrieval / tool descriptions, re-run, and read the side-by-side grid in `promptfoo view`.
#
# WHAT THIS IS NOT: a CI gate. It costs money (real Bedrock calls on both the bot and the
# judge), it is slow (a live agentic loop plus live Primo calls per question), and an
# LLM judge is noisy at the margin. Run it on demand and before a release, not per commit.
#
# It is deliberately NOT an exact-match eval. The bot's real holdings change (databases,
# catalog, hours), so grading its answers against frozen ideal text would measure staleness,
# not quality. The rubrics grade behavior and support instead.
#
# Prereqs (see README.md): Node, AWS creds for Bedrock, and GAV_QUERY_URL set to the
# deployed POST /query URL.

description: Gavilan Library chatbot - answer quality (behavior + groundedness) vs deployed /query

# The "prompt" is just the student's question. All request shaping happens in the HTTP
# provider body below, because the system under test is the deployed endpoint, not a model.
prompts:
  - '{{question}}'

providers:
  - id: http
    label: gavilan-query
    config:
      # NEVER hardcode the endpoint - it differs per deploy and is not a repo constant.
      # Export GAV_QUERY_URL before running (see README.md).
      url: '{{ env.GAV_QUERY_URL }}'
      method: POST
      headers:
        Content-Type: application/json
      body:
        # The real multi-turn /query contract. Single user turn == a fresh conversation.
        messages:
          - role: user
            content: '{{question}}'
        # Opt-in eval flag the query Lambda already supports: adds `full_context` to the
        # response - the un-deduped, un-truncated KB passages the model actually saw.
        # The widget never sets it, so this does not change production behavior.
        include_full_context: true
      # The grid column (and every deterministic assertion) sees ONLY the answer text, so
      # the side-by-side view stays readable and `contains`/`regex` checks can't accidentally
      # match against retrieved context. The retrieved passages ride along in `metadata`,
      # which the groundedness assertion pulls out via its own `transform` (see below).
      transformResponse: |
        ({
          output: json.answer || '',
          metadata: {
            retrieved_context: (json.full_context || [])
              .map((c, i) => '[' + (i + 1) + '] ' + c.text + (c.source ? '\n    (source: ' + c.source + ')' : ''))
              .join('\n\n'),
            source_uris: (json.sources || []).map((s) => s.uri).join('\n'),
          },
        })

defaultTest:
  options:
    # LLM-as-judge over Bedrock, so no OpenAI key is needed. Same model family the bot
    # itself generates with; a strong judge matters more than a cheap one on a 11-row set.
    # AWS creds come from the ambient environment (see README.md).
    provider:
      id: bedrock:us.anthropic.claude-sonnet-4-6
      config:
        region: us-west-2
        temperature: 0
        max_tokens: 1024

  # Every question gets the same four checks. Per-question specifics live in the
  # `expected_behavior` var (dataset.yaml), which the behavior rubric interpolates.
  assert:
    # --- 1. BEHAVIOR -------------------------------------------------------------------
    - type: llm-rubric
      metric: behavior
      value: |
        You are grading a single reply from the Gavilan College Library chatbot. It is an
        operational assistant for a community college library: it answers practical questions
        (hours, borrowing, printing, services, contact, what the library holds) using live
        lookup tools, and it routes research questions, IT problems, and anything outside the
        library to a human or the right department. It is explicitly NOT a research librarian
        and NOT a general-purpose assistant.

        THE STUDENT ASKED:
        {{ question }}

        THE EXPECTED BEHAVIOR FOR THIS QUESTION:
        {{ expected_behavior }}

        Grade ONLY whether the reply does the right thing. Judge the behavior, not the wording.

        PASS if the reply does substantially what the expected behavior describes.
        FAIL if it does something materially different: answers an out-of-scope question
        instead of routing it, routes an in-scope operational question it should have
        answered, sends the student to the wrong place, confidently asserts something it
        clearly could not know, or gives no usable next step.

        Explicitly DO NOT fail a reply for any of these:
        - Not containing specific facts (exact hours, prices, phone numbers, titles). This
          eval runs against live data; the correct answer changes over time. Saying "I don't
          have that - here is who does" is a CORRECT behavior, not a failure.
        - Being shorter or longer than you would have written it.
        - Asking one brief clarifying question, when the expected behavior allows for it.
        - Phrasing, tone, or formatting differences.

        Be strict about routing and about unsupported confidence. Be lenient about everything
        else.

    # --- 2. GROUNDEDNESS ---------------------------------------------------------------
    # `transform` reshapes what THIS assertion's judge sees: the answer plus the retrieved
    # passages from provider metadata. The grid column and the other assertions are
    # unaffected - they still see the bare answer.
    - type: llm-rubric
      metric: groundedness
      transform: |
        const ctx = (context.metadata && context.metadata.retrieved_context) || '';
        const uris = (context.metadata && context.metadata.source_uris) || '';
        return [
          'THE ANSWER THE BOT GAVE:',
          output,
          '',
          'KNOWLEDGE-BASE PASSAGES RETRIEVED FOR THIS QUESTION:',
          ctx.trim() ? ctx : '(NONE - see the rubric; this is expected for some questions)',
          '',
          'SOURCE LINKS THE BOT ATTACHED:',
          uris.trim() ? uris : '(none)',
        ].join('\n');
      value: |
        You are checking a Gavilan College Library chatbot answer for HALLUCINATION. Grounding
        in this system is enforced by the prompt, not by a guardrail, so this is the check that
        matters most.

        You are given the answer, plus the knowledge-base passages that were retrieved for it.

        CRITICAL - READ THIS BEFORE GRADING:
        The retrieved passages are the output of ONE of the bot's four tools: the website
        knowledge-base search. The other three tools (the research-database catalog, the live
        book catalog, and the live course-reserves search) return their results through a
        different path that is NOT captured here. So an EMPTY or INCOMPLETE passage list is
        normal and is NOT by itself evidence of hallucination. It usually means the bot
        answered from a catalog or live-search tool, or correctly answered without a tool at
        all (a greeting, a refusal, a routing reply, a clarifying question).

        FAIL only when you can point at something concretely wrong:
        - The answer CONTRADICTS a retrieved passage.
        - The answer states a specific, checkable fact (a time, a date, a price, a fee, a room,
          a call number, a phone number, an email address, a policy limit, a loan period, a
          named title or author) that no passage supports AND that the bot has no plausible way
          to know. Specific invented detail is the failure mode; general statements about how
          libraries work are not.
        - The answer gives a URL or web address that does not appear in the retrieved passages
          or source links. The bot is instructed never to construct a link from memory.
        - The answer asserts the library definitely does or does not have something, with no
          support for that claim.

        PASS when:
        - Every checkable claim traces to a passage, or
        - The answer is appropriately hedged ("the catalog shows...", "check with a librarian
          to confirm", "I don't have that information"), or
        - The answer is a refusal, routing, greeting, or clarifying question that asserts no
          library facts at all, or
        - There are no passages and the answer makes no specific unsupported claim.

        Hedged uncertainty is CORRECT behavior for this bot and must never be marked down.
        Being wrong is worse than saying "I don't know" - grade accordingly.

    # --- 3-4. DETERMINISTIC CHECKS -----------------------------------------------------
    # Kept few and genuinely safe. These are invariants of the system prompt, not guesses
    # about what the answer should say.

    # A blank/whitespace answer means the endpoint or the agent loop broke. Distinguishes a
    # real failure from a merely bad answer, which the rubrics would score confusingly.
    - type: javascript
      metric: not_empty
      value: output.trim().length > 0

    # The system prompt bans em dashes and en dashes outright ("Use a plain hyphen with
    # spaces, a comma, or split the sentence instead"). Any occurrence is a prompt-compliance
    # regression, and this is cheap to check exactly.
    - type: not-regex
      metric: no_dashes
      value: '[—–]'

tests: file://dataset.yaml
