# Eval-harness infrastructure config.
#
# SDK/boto3 operational-tooling config (separate from the app's root config.yaml). Fill the
# placeholders below (account id, role, bucket, knowledge_base_id) with your own deployed
# resources. The generate-eval fields (generate.bot_api_url) remain TBD - that path is out of
# scope until the bot capture stage is implemented.

eval:
  # AWS region where Bedrock evaluation jobs run. Must match the KB's region and the evaluator
  # model's region (all resources must be co-located). us-west-2 is where the KB and the Nova Pro
  # inference profile are served.
  region: us-west-2

  # IAM role Bedrock assumes to run the job. Needs read/write on the eval S3 bucket, InvokeModel
  # on the evaluator model, and Retrieve/RetrieveAndGenerate on the KB. Standalone dev/ops role,
  # NOT part of the CDK app stack (created via CLI).
  role_arn: "arn:aws:iam::123456789012:role/gavilan-bedrock-eval-role"

  # Dedicated S3 bucket for eval input (JSONL datasets) and Bedrock output (results). CORS is NOT
  # required for knowledge-base evaluation jobs (only human-based eval needs it). Standalone,
  # not in the CDK stack.
  bucket: "gavilan-chatbot-eval-123456789012"

  # Key prefixes within the bucket.
  input_prefix: "eval/input"
  output_prefix: "eval/output"

  # LLM-as-judge evaluator model id. Amazon Nova Pro (via the us. cross-region inference profile);
  # confirmed invocable in this account and on Bedrock's supported evaluator-model list for RAG eval.
  evaluator_model_id: "us.amazon.nova-pro-v1:0"

  # Bedrock evaluation application type for RAG evaluation.
  application_type: "RagEvaluation"

  # Retrieve-only evaluation: the eval job points at the live KB and runs Retrieve itself.
  # Measures chunking/retrieval quality via
  # Builtin.ContextCoverage + Builtin.ContextRelevance.
  retrieve:
    # KB whose retrieval quality is being evaluated (the deployed S3 Vectors KB).
    knowledge_base_id: "XXXXXXXXXX"
    # How many chunks Retrieve returns per query. This duplicates the root config.yaml's
    # retrieval.number_of_results and can silently drift from it: to evaluate the PRODUCTION
    # configuration, keep this equal to that value, or the eval measures a different retrieval
    # depth than the deployed bot uses. Diverge deliberately only for A/B depth experiments.
    number_of_results: 5
    # overrideSearchType. MUST be SEMANTIC: the KB is backed by Amazon S3 Vectors, which is
    # semantic-search-only - HYBRID is not available on this store and would fail the retrieve
    # call. (Keyword coverage is the future agentic-lookup work, not a retrieval search type.)
    search_type: "SEMANTIC"

  # Retrieve-and-generate evaluation: the answer-quality evaluator. BRING-YOUR-OWN-INFERENCE
  # Metrics: Correctness, Completeness, Faithfulness, Helpfulness, Harmfulness
  # (+ CitationCoverage/CitationPrecision only when citations are captured).
  generate:
    # BYOI source id. MUST match output.knowledgeBaseIdentifier in every JSONL line and
    # ragSourceIdentifier in the inferenceConfig. Human-chosen string.
    rag_source_identifier: "gavilan-bot-v1"
    # Deployed bot's HTTP API /query endpoint. The capture stage POSTs each question
    # here. TBD: real URL once the bot is deployed (see capture_outputs.py).
    bot_api_url: "https://TBD.execute-api.us-west-2.amazonaws.com/query"
