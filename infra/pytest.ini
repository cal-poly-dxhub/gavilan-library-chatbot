[pytest]
# Collect only our unit tests. Without this, pytest walks the whole infra/ tree and tries to
# collect vendored test files shipped inside the bundled scraper deps layer under cdk.out/ (e.g.
# regex/tests, tld/tests), which error on import. Keep collection scoped and hermetic.
testpaths = tests
norecursedirs = cdk.out .venv .pytest_cache
